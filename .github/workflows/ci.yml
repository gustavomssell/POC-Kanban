name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanbanql
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Retry: o npm ci do runner já falhou em ~2s (flake de registry, sem
      # mensagem aproveitável no artefato) — 3 tentativas cobrem o transitório.
      - name: npm ci
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci falhou (tentativa $i/3)" >&2
            sleep 15
          done
          exit 1
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanbanql
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: npm ci
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci falhou (tentativa $i/3)" >&2
            sleep 15
          done
          exit 1
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
